server {
    listen 8080;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    add_header Cache-Control "no-store" always;

    location = /maintenance.html {
        internal;
    }

    location /api/ {
        default_type application/json;
        add_header X-Correlation-Id $request_id always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 30 always;
        if (-f /maintenance/enabled) {
            return 503 '{"code":"MAINTENANCE","message":"The demo is being restored. Please try again shortly.","correlation_id":"$request_id"}';
        }
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        error_page 503 /maintenance.html;
        if (-f /maintenance/enabled) { return 503; }
        try_files $uri $uri/ /index.html;
    }
}

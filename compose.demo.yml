name: pandora-demo

x-api: &api
  image: pandora-demo-api:local
  build:
    context: .
    dockerfile: deploy/demo/Dockerfile
    target: api
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://pandora_demo:${DEMO_DB_PASSWORD:?set in .env.demo}@postgres:5432/pandora_demo?schema=public
    API_PORT: 3000
    CATALOG_CURRENCY: EUR
    # The demo is served only over HTTPS (Caddy), so session cookies are Secure.
    SESSION_COOKIE_SECURE: "true"
    SEED_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set in .env.demo}
  init: true

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: pandora_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?set in .env.demo}
      POSTGRES_DB: pandora_demo
    volumes:
      - demo-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pandora_demo -d pandora_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *api
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Delivers outbox jobs to the demo's own captured inbox; stopped and restarted by demo:reset with the API.
  worker:
    <<: *api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pandora_demo:${DEMO_DB_PASSWORD:?set in .env.demo}@postgres:5432/pandora_demo?schema=public
      NOTIFICATION_SMTP_URL: smtp://mailpit:1025
    command: ["node", "dist/worker.js"]
    stop_grace_period: 30s

  # Captured inbox, published read-only at /mail/ through Caddy.
  mailpit:
    image: axllent/mailpit:v1.31.3
    environment:
      MP_WEBROOT: /mail/
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"

  reset:
    <<: *api
    profiles: [tools]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pandora_demo:${DEMO_DB_PASSWORD:?set in .env.demo}@postgres:5432/pandora_demo?schema=public
      SEED_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set in .env.demo}
      DEMO_RESET_ALLOWED: "true"
    command: ["node", "dist/seed/demo-reset.js"]

  web:
    image: pandora-demo-web:local
    build:
      context: .
      dockerfile: deploy/demo/Dockerfile
      target: web
    volumes:
      - demo-maintenance:/maintenance

  # The only published service: HTTP redirects to HTTPS; container ports equal host ports so redirects keep them.
  caddy:
    image: caddy:2.11.4-alpine
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:-localhost}
      DEMO_TLS: ${DEMO_TLS:-internal}
      DEMO_HSTS: ${DEMO_HSTS:-max-age=0}
      DEMO_PORT: ${DEMO_PORT:-5180}
      DEMO_HTTPS_PORT: ${DEMO_HTTPS_PORT:-5443}
    ports:
      - "${DEMO_BIND:-127.0.0.1}:${DEMO_PORT:-5180}:${DEMO_PORT:-5180}"
      - "${DEMO_BIND:-127.0.0.1}:${DEMO_HTTPS_PORT:-5443}:${DEMO_HTTPS_PORT:-5443}"
    volumes:
      - ./deploy/demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - demo-caddy-data:/data
      - demo-caddy-config:/config
    depends_on: [web, mailpit]

volumes:
  demo-data:
  demo-maintenance:
  demo-caddy-data:
  demo-caddy-config:
